# One workspace, crates cut by dependency, not by platform. A plugin's
# folder under plugins/ holds its two crates: `client/`, its client half,
# and `world/`, its world half. The console the cabinets run, TKN-32, is a
# workspace of its own beside this one, under its own licence: the engine
# carries its emulator built (arcade/emulator/, the `arcade` crate) and
# compiles none of its source. A game for it is a workspace of its own too:
# the engine ships its built file, a ROM in arcade/roms/, never its source.
[workspace]
resolver = "3"
members = ["crates/*", "plugins/*/client", "plugins/*/world"]

[workspace.package]
version = "0.0.0" # the released version is the git tag (release.config.js)
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/tekne-studio/planet"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
topology = { path = "crates/topology" }
worldgen = { path = "crates/worldgen" }
scene = { path = "crates/scene" }
avatar = { path = "crates/avatar" }
glb = { path = "crates/glb" }
client = { path = "crates/client" }
module = { path = "crates/module" }
render = { path = "crates/render" }
protocol = { path = "crates/protocol" }
voxel = { path = "crates/voxel" }
vox = { path = "crates/vox" }
part = { path = "crates/part" }
seat = { path = "crates/seat" }
gaia = { path = "crates/gaia" }
world = { path = "crates/world" }
plugins-client = { path = "crates/plugins-client" }
plugins-world = { path = "crates/plugins-world" }
ui-native = { path = "crates/ui-native" }
arcade = { path = "crates/arcade" }
arcade-host = { path = "crates/arcade-host" }
synth = { path = "crates/synth" }

# wgpu 30 and winit 0.30, pinned: both change their APIs between versions,
# so the code follows the source of these two, never older docs.
wgpu = "30"
winit = "0.30"

bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
libm = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A file's name is the SHA-256 of its bytes: the pinned emulator's, a
# cartridge's whose prepared bytes are kept.
sha2 = { version = "0.11", default-features = false }
proptest = "1"
prost = "0.14"
# allow_empty_texture: a texture whose picture an extension names has no
# source, and is read as having none rather than unwrapped.
gltf = { version = "1.4", default-features = false, features = ["allow_empty_texture", "extensions", "names", "utils"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The generator runs every frame while streaming: keep dev builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
