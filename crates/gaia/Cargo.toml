[package]
name = "gaia"
description = "The life of a world: the plants it grows from its seed on its generator's ground; its animals as data, a body that walks on the ground it is handed, a herd's path in closed form."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glam = { workspace = true, features = ["serde"] }
libm.workspace = true
serde.workspace = true
scene.workspace = true
topology.workspace = true
worldgen.workspace = true

# The goldens run on wasm32 under node too (`.cargo/config.toml` names the
# runner): what lives is the same bits on every platform.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
