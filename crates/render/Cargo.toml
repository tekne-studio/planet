[package]
name = "render"
description = "The renderer. All of wgpu lives here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
scene.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true

# Headless frames leave as PNG: the way every change gets looked at.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.18"
pollster = "0.4"

# The WebGL2 floor: every shader validated and translated to GLSL ES 3.0 as
# wgpu's GL backend does it (src/floor.rs).
[dev-dependencies]
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
wgpu-naga-bridge = "30"

[lints]
workspace = true
