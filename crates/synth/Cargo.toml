[package]
name = "synth"
description = "Sound made by code: a voice as data, a few layers of oscillator or noise shaped by a glide, a vibrato, an envelope and a filter, rendered from a seed to the same samples on every platform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libm.workspace = true

# The same tests run on wasm32 under node (`.cargo/config.toml` names the
# runner): the samples a seed gives are one on every platform.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
